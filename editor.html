<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="dsh-design" content="miniprogram"><title>编辑拼贴 · 拼贴一下</title>
  <link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="mp-top"><div class="mp-status"><span>9:41</span><span class="mp-status__icons"><span class="signal">•••</span><span>5G</span><span class="battery"></span></span></div><div class="mp-nav"><a class="mp-back" href="upload.html" aria-label="返回选择照片"><svg class="icon"><use href="icons.svg#arrow-left"></use></svg></a><h1>编辑拼贴</h1></div></header>
  <main class="mp-page mp-page--editor">
    <div class="editor-toolbar"><strong>蓝色留白</strong><span>3 张照片 · 自动保存</span></div>
    <div class="canvas"><div class="canvas__mark">03</div><div class="canvas__photo canvas__photo--one"><img src="assets/ai-photo-fashion-05.jpg" alt="拼贴大图"></div><div class="canvas__photo canvas__photo--two"><img src="assets/ai-photo-fashion-03.jpg" alt="拼贴左下图"></div><div class="canvas__photo canvas__photo--three" style="background:#fff"><span style="display:block;padding:12px;color:var(--color-accent);font-weight:700;font-size:var(--text-lg);line-height:1.1">KEEP<br>THE<br>MOMENT</span></div></div>
    <div class="editor-tools"><a class="editor-tool on" href="editor.html"><svg class="icon"><use href="icons.svg#edit"></use></svg><span>裁切</span></a><a class="editor-tool" href="editor.html"><svg class="icon"><use href="icons.svg#grid"></use></svg><span>换版式</span></a><a class="editor-tool" href="editor.html"><svg class="icon"><use href="icons.svg#copy"></use></svg><span>替换</span></a><a class="editor-tool" href="editor.html"><svg class="icon"><use href="icons.svg#plus"></use></svg><span>加一格</span></a></div>
    <div class="tip-line"><svg class="icon"><use href="icons.svg#check"></use></svg><span>拖动照片可以调整位置，双指可缩放</span></div>
  </main>
  <div class="mp-actionbar"><a class="btn btn--secondary" href="upload.html">继续选图</a><a class="btn btn--primary" href="saving.html">保存拼贴 <svg class="icon"><use href="icons.svg#download"></use></svg></a></div>
</body>
</html>
