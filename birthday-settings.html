<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="dsh-design" content="miniprogram"><title>生日设置 · 拼贴一下</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="app.css"></head>
<body>
<header class="mp-top"><div class="mp-status"><span>9:41</span><span class="mp-status__icons"><span class="signal">•••</span><span>5G</span><span class="battery"></span></span></div><div class="mp-nav"><a class="mp-back" href="layout-library.html" aria-label="返回版式库"><svg class="icon"><use href="icons.svg#arrow-left"></use></svg></a><h1>生日九宫格</h1></div></header>
<main class="mp-page mp-page--sub">
  <div class="upload-intro"><h2>把生日拼成<br>一页小小的纪念。</h2><p>先选月份和主题，照片稍后再上传。</p></div>
  <div class="gallery-nav"><h2>选择月份</h2><span style="color:var(--color-muted);font-size:var(--text-sm)">日历会出现在成片里</span></div>
  <div class="calendar-picker"><a class="month-card" href="birthday-settings.html">01<small>JAN</small></a><a class="month-card" href="birthday-settings.html">02<small>FEB</small></a><a class="month-card" href="birthday-settings.html">03<small>MAR</small></a><a class="month-card" href="birthday-settings.html">04<small>APR</small></a><a class="month-card" href="birthday-settings.html">05<small>MAY</small></a><a class="month-card" href="birthday-settings.html">06<small>JUN</small></a><a class="month-card" href="birthday-settings.html">07<small>JUL</small></a><a class="month-card on" href="birthday-settings.html">09<small>SEP</small></a><a class="month-card" href="birthday-settings.html">10<small>OCT</small></a><a class="month-card" href="birthday-settings.html">11<small>NOV</small></a><a class="month-card" href="birthday-settings.html">12<small>DEC</small></a></div>
  <div class="gallery-nav"><h2>选择主题</h2><a href="birthday-settings.html">更多主题 <span>→</span></a></div>
  <div class="theme-strip"><a class="theme-card on" href="birthday-settings.html"><img src="assets/templates/birthday-calendar-01.png" alt="白金日历主题"><span>白金日历</span></a><a class="theme-card" href="birthday-settings.html"><img src="assets/templates/birthday-black-gold-01.png" alt="黑金生日主题"><span>黑金千金</span></a><a class="theme-card" href="birthday-settings.html"><img src="assets/templates/black-red-01.png" alt="黑红派对主题"><span>黑红派对</span></a><a class="theme-card" href="birthday-settings.html"><img src="assets/templates/leopard-four-grid-01.png" alt="豹纹生日主题"><span>Wild</span></a></div>
  <a class="handdraw-card" href="annotation.html"><span class="handdraw-card__copy"><strong>打开手绘标注</strong><span>上传后可以写日期、画心情、加一句话</span></span><span class="switch" aria-label="手绘标注已开启"></span></a>
</main>
<div class="mp-actionbar"><a class="btn btn--secondary" href="home.html">换模板</a><a class="btn btn--primary" href="birthday-upload.html">上传 9 张照片 <svg class="icon"><use href="icons.svg#arrow-right"></use></svg></a></div>
