    <div class="photo-row"><div class="photo-row__thumb"><img src="assets/ai-photo-fashion-05.jpg" alt="已选择照片一"></div><div><strong>IMG_2048.jpg</strong><span>第 1 格 · 主图</span></div><a class="photo-row__remove" href="birthday-upload.html">移除</a></div>
    <div class="photo-row"><div class="photo-row__thumb"><img src="assets/ai-photo-scenery-08.jpg" alt="已选择照片二"></div><div><strong>IMG_2051.jpg</strong><span>第 2 格</span></div><a class="photo-row__remove" href="birthday-upload.html">移除</a></div>
    <div class="photo-row"><div class="photo-row__thumb"><img src="assets/ai-photo-drink-07.jpg" alt="已选择照片三"></div><div><strong>IMG_2056.jpg</strong><span>第 3 格</span></div><a class="photo-row__remove" href="birthday-upload.html">移除</a></div>
  </div>
